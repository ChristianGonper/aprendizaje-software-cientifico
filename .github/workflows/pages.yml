# Publica el árbol del repositorio en GitHub Pages.
# Las páginas de demos/ enlazan figuras y HTML vecinos con rutas relativas.
name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir _site
          # El árbol versionado, sin .git ni entornos locales (.venv, etc.).
          git archive HEAD | tar -x -C _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
